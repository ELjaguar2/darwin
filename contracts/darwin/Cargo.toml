[package]
name = "darwin"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Darwin : registre des agents et genealogie, sequestre des taches, reputation (NEAR testnet)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
